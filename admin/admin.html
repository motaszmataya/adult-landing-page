<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffd400">
<title>MediaHub — Admin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">

    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MediaHub">
    <!-- /puter-pwa -->

<body>
<header class="site-header">
  <div class="container">
    <nav class="navbar navbar-dark px-0">
      <a class="navbar-brand brand" href="index.html">
        <span class="brand-mark"><i data-lucide="aperture"></i></span>
        <span>Media<b>Hub</b> <small class="text-muted font-weight-normal ml-1">Admin</small></span>
      </a>
      <div class="d-flex align-items-center">
        <span class="user-pill mr-3 d-none" id="userPill"><i data-lucide="user"></i><span id="userName"></span></span>
        <a href="index.html" class="btn btn-ghost btn-sm mr-2"><i data-lucide="external-link" class="mr-1"></i>View site</a>
        <button class="btn btn-ghost btn-sm d-none" id="signOutBtn"><i data-lucide="log-out"></i></button>
      </div>
    </nav>
  </div>
</header>

<!-- Sign in -->
<div class="signin-wrap d-none" id="signinView">
  <div class="card-d signin-card">
    <span class="brand-mark"><i data-lucide="lock"></i></span>
    <h4 class="font-weight-bold mb-1">Admin sign in</h4>
    <p class="text-muted mb-4">Enter your credentials to manage media.</p>
    <form id="loginForm" class="text-left" autocomplete="on">
      <div class="form-group">
        <label class="lbl" for="loginUser">Username</label>
        <input class="form-control" id="loginUser" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="lbl" for="loginPass">Password</label>
        <input class="form-control" id="loginPass" type="password" autocomplete="current-password" required>
      </div>
      <div class="text-danger small mb-3 d-none" id="loginErr"></div>
      <button class="btn btn-yellow btn-block" type="submit" id="signInBtn"><i data-lucide="log-in" class="mr-1"></i> Sign in</button>
    </form>
  </div>
</div>

<!-- Loading -->
<div class="signin-wrap" id="loadingView"><div class="spinner-border text-warning" role="status"></div></div>

<!-- Dashboard -->
<main class="container admin-shell py-4 d-none" id="dashView">
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-4" style="gap:1rem">
    <div class="admin-tabs" id="tabs">
      <button class="active" data-type="gallery"><i data-lucide="image"></i> Gallery</button>
      <button data-type="videos"><i data-lucide="film"></i> Videos</button>
    </div>
    <div class="d-flex" style="gap:1.5rem">
      <div class="stat"><div class="ic"><i data-lucide="layers"></i></div><div><div class="num" id="statItems">0</div><div class="lab" id="statItemsLab">Photos</div></div></div>
      <div class="stat"><div class="ic"><i data-lucide="folder"></i></div><div><div class="num" id="statCats">0</div><div class="lab">Categories</div></div></div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-8 mb-4">
      <div class="card-d">
        <div class="card-h"><h6><i data-lucide="upload-cloud"></i> <span id="uploadTitle">Upload pictures</span></h6></div>
        <div class="card-b">
          <div class="dropzone" id="dropzone">
            <i data-lucide="upload"></i>
            <div class="font-weight-bold text-white" id="dzText">Drop pictures here or click to browse</div>
            <small id="dzHint">JPG, PNG, GIF, WEBP — multiple files allowed</small>
            <input type="file" id="fileInput" multiple hidden>
          </div>
          <div class="file-chips" id="fileChips"></div>
          <div class="form-row mt-3">
            <div class="col-md-6 mb-2">
              <label class="lbl">Title (optional)</label>
              <input class="form-control" id="upTitle" placeholder="Defaults to file name">
            </div>
            <div class="col-md-6 mb-2">
              <label class="lbl">Category</label>
              <select class="custom-select" id="upCat"></select>
            </div>
          </div>
          <div class="progress mt-2 d-none" id="upProgWrap"><div class="progress-bar" id="upProg" style="width:0%"></div></div>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <small class="text-muted" id="upStatus"></small>
            <button class="btn btn-yellow" id="uploadBtn" disabled><i data-lucide="upload" class="mr-1"></i> Upload</button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4 mb-4">
      <div class="card-d h-100">
        <div class="card-h"><h6><i data-lucide="folder-plus"></i> Categories</h6></div>
        <div class="card-b">
          <form id="catForm" class="d-flex mb-3">
            <input class="form-control mr-2" id="catName" placeholder="New category name" maxlength="40">
            <button class="btn btn-yellow" type="submit"><i data-lucide="plus"></i></button>
          </form>
          <ul class="cat-list" id="catList"></ul>
        </div>
      </div>
    </div>
  </div>

  <div class="card-d">
    <div class="card-h">
      <h6><i data-lucide="layout-grid"></i> <span id="libTitle">Photo library</span></h6>
      <select class="custom-select custom-select-sm" id="libFilter" style="width:auto"></select>
    </div>
    <div class="card-b">
      <div class="row" id="library"></div>
    </div>
  </div>
</main>

<div class="toast-wrap" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
